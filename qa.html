<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Design QA · Brightest Tonight</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 12px; color: #eaf2ff; background: #07111f; font-family: system-ui, sans-serif; }

      p { margin: 0 0 10px; color: #8fa8c8; font-size: 9px; }
      main { display: flex; gap: 10px; align-items: flex-start; }
      figure { margin: 0; }
      figcaption { margin-bottom: 5px; color: #aac2df; font-size: 9px; }
      img { display: block; width: 275px; height: 489px; object-fit: cover; object-position: top; border: 1px solid #274463; border-radius: 12px; }
      iframe { display: block; width: 275px; height: 489px; border: 1px solid #274463; border-radius: 12px; background: #07111f; }

  </head>
  <body>
    <h1>今夜最亮星 · 视觉对照</h1>

    <main>
      <figure><figcaption>Source visual</figcaption><img src="/assets/app/source-reference.png" alt="Source visual" /></figure>
      <figure><figcaption>Rendered implementation</figcaption><iframe src="/?demo=1" title="Rendered implementation"></iframe></figure>
    </main>
